// Compose stability configuration.
//
// Every list, map and set that reaches a composable in this app is built once — by a payload parser,
// by a preferences read, or by a `copy` on a state object — and then replaced wholesale rather than
// edited in place. Nothing hands Compose a collection it goes on to mutate: the only `mutableListOf`
// and `mutableMapOf` calls in the project build a result inside a function and return it typed as a
// read-only collection, and the three menu reorderings copy the list, edit the copy, and immediately
// give away the only reference to it.
//
// Why it matters. Strong skipping is on, so an unstable parameter does not stop a composable being
// skippable — it changes how that parameter is *compared*. An unstable argument is compared by
// instance identity, so a refresh that returns the same data in new objects recomposes everything
// that touches it; a stable one is compared with `equals` and skips. The compiler infers a class
// unstable if it holds a single `List<String>`, and `LibraryMedia` holds two (facts, genres) — so
// every card, rail and page that touches one was on identity comparison.
//
// Measured with `composeCompiler { metricsDestination = ... }`: 35 model classes moved from unstable
// to stable and 85 arguments from identity to equality comparison. The skippable-composable count
// barely moves, and that is expected: strong skipping had already covered that half of it.
//
// Only the collection types are declared here. The model classes are left to inference on purpose,
// so that a field which really is mutable makes its class unstable again instead of being covered by
// a blanket promise nobody re-checked.
kotlin.collections.List
kotlin.collections.Map
kotlin.collections.Set
