<!doctype html>
<html lang="nn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Spole Cast Receiver" />
    <title>Spole</title>
    <script defer src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  </head>
  <body>
    <main class="receiver-shell" aria-label="Spole">
      <div class="receiver-mark" aria-hidden="true">S</div>
      <section class="receiver-status" aria-live="polite">
        <span class="spinner" aria-hidden="true"></span>
        <p id="receiver-status">Klargjer avspeling</p>
      </section>
      <footer class="receiver-controls" aria-hidden="true">
        <div class="artwork-placeholder"></div>
        <div class="metadata">
          <strong id="receiver-title">Spole</strong>
          <span id="receiver-source">Vel ein video på telefonen</span>
          <div class="progress-track"><div class="progress-fill"></div></div>
          <small>00:00 <span>—</span> 00:00</small>
        </div>
        <div class="transport">‹&nbsp;&nbsp;Ⅱ&nbsp;&nbsp;›</div>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
