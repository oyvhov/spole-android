name: Publiser Cast-mottakar

on:
  push:
    branches: [main]
    paths: ["cast-receiver/**", ".github/workflows/deploy-cast-receiver.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cast-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}cast/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer mottakaren
        working-directory: cast-receiver
        run: npm install --ignore-scripts
      - name: Test offentleg mottakar
        working-directory: cast-receiver
        run: npm run check:public && npm test && npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: cast-receiver/dist
      - id: deployment
        uses: actions/deploy-pages@v4
