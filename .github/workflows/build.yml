name: Bygg og test

# Every branch, not only main. Arbeidet skjer på langlivde feature-greiner — 0.14.2 til og med
# 0.15.1 vart tagga og publiserte utan nokon gong å nå main, så CI såg ingenting av dei.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The wrapper is committed from Windows and carries mode 100644, so the runner would
      # otherwise stop at "Permission denied" before Gradle ever starts.
      - name: Gjer wrapperen køyrbar
        run: chmod +x ./gradlew

      - name: Sjekk versjonskonsistens
        run: python3 scripts/check-release-consistency.py

      # No signing.properties here, and there must not be: the production key lives on the
      # developer's machine and nowhere else. Normal CI verifies the parts that do not need a key.
      - name: Sjekk språkressursar
        run: python3 scripts/check-translations.py

      - name: Einingstestar, lint og bygg
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      # Optional advice on an explicitly enabled manual run. Ordinary CI never calls Jev.
      # Never send PR data or expose a key to a PR.
      - name: Rådgjevande Jev-kontroll av testfeil
        if: always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && vars.JEV_ENABLED == 'true'
        continue-on-error: true
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          JEV_ENABLED: ${{ vars.JEV_ENABLED }}
        shell: bash
        run: |
          jev_args=()
          if [[ "$JEV_ENABLED" == 'true' && -n "$TYPESAFE_API_KEY" ]]; then
            jev_args+=(--live)
          fi
          python3 scripts/jev-review.py --junit app/build/test-results/testDebugUnitTest \
            --max-calls 10 --github-summary "${jev_args[@]}"

      - name: Lagre Jev-rapport
        if: always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && vars.JEV_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: jev-rapport
          path: |
            app/build/jev-review/report.md
            app/build/jev-review/report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Bygg usignert release for lokal signering
        if: github.event_name == 'workflow_dispatch'
        run: ./gradlew --no-daemon assembleRelease -Pspole.allowUnsignedRelease=true

      - name: Lagre usignert release
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: usignert-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 1

      - name: Lagre testrapportar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapportar
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/test-results/
          retention-days: 14

  instrumentation-tests:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        surface: ${{ fromJSON(github.event_name == 'pull_request' && '["phone"]' || '["phone", "tv"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Gjer wrapperen køyrbar
        run: chmod +x ./gradlew
      - name: Aktiver KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android Instrumented Tests on Isolated Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: ${{ matrix.surface == 'tv' && 'google-tv' || 'google_apis' }}
          profile: ${{ matrix.surface == 'tv' && 'tv_1080p' || 'pixel_7' }}
          arch: x86_64
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim
          script: |
            if [[ '${{ github.event_name }}' == 'pull_request' ]]; then
              ./gradlew --no-daemon connectedDebugAndroidTest '-Pandroid.testInstrumentationRunnerArguments.class=app.reelstack.ReelstackSmokeTest,app.reelstack.SheetInteractionTest,app.reelstack.LoginExperienceTest'
            elif [[ '${{ matrix.surface }}' == 'tv' ]]; then
              ./gradlew --no-daemon connectedDebugAndroidTest '-Pandroid.testInstrumentationRunnerArguments.class=app.reelstack.LoginExperienceTest,app.reelstack.ProfileSessionBoundaryTest,app.reelstack.TvNavigationIntegrationTest,app.reelstack.WatchNextTest,app.reelstack.JellyfinPlayerTest#accountReplacementStopsOldPlayer,app.reelstack.JellyfinPlayerTest#backgroundPlayerStaysRevokedAfterSwitchingAwayAndBack'
            else
              ./gradlew --no-daemon connectedDebugAndroidTest '-Pandroid.testInstrumentationRunnerArguments.class=app.reelstack.ReelstackSmokeTest,app.reelstack.SheetInteractionTest,app.reelstack.LoginExperienceTest,app.reelstack.LinkedLoginTest,app.reelstack.ProfileSessionBoundaryTest,app.reelstack.RequestHistoryFlowTest,app.reelstack.OfflineDownloadsUiTest,app.reelstack.OfflinePlaybackIntegrationTest'
            fi
      - name: Lagre Android-testresultat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.surface }}-36
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14
