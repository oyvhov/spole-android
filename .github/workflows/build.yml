name: Bygg og test

# Every branch, not only main. Arbeidet skjer på langlivde feature-greiner — 0.14.2 til og med
# 0.15.1 vart tagga og publiserte utan nokon gong å nå main, så CI såg ingenting av dei.
on:
  push:
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The wrapper is committed from Windows and carries mode 100644, so the runner would
      # otherwise stop at "Permission denied" before Gradle ever starts.
      - name: Gjer wrapperen køyrbar
        run: chmod +x ./gradlew

      # No signing.properties here, and there must not be: the production key lives on the
      # developer's machine and nowhere else. assembleRelease would fail the check in
      # app/build.gradle.kts, so CI verifies the parts that do not need a key. The signed
      # artefact is still built and published by hand.
      - name: Einingstestar og lint
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug

      - name: Byggkontroll
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest

      - name: Lagre testrapportar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapportar
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/test-results/
          retention-days: 14
